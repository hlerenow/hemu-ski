<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Snowboard crash review</title><style>body{margin:0;background:#deebf0;font:14px system-ui}#bar{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{padding:8px}canvas{display:block}#info{width:100%}</style></head><body><div id="bar"><b>Snowboard crash review</b><button id="play">Replay</button><button id="pause">Pause</button><label>Crash <select id="kind"></select></label><label>Rider <select id="model"><option value="female">Female</option><option value="male">Male</option><option value="classic">Classic</option></select></label><label>Slope <select id="slope"><option value="0">Flat</option><option value="20">20°, travelling down it</option><option value="30" selected>30°, travelling down it</option></select></label><label>View <select id="view"><option value="3/4">Three-quarter</option><option value="front">Chest side</option><option value="back">Back side</option><option value="along">Down the board</option></select></label><label>Time <input id="time" type="range" min="0" max="5.5" step="0.01" value="0"></label><span id="info">Loading…</span></div><script type="module" src="./fall-review.js"></script></body></html>
