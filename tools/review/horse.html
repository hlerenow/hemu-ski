<!doctype html><html lang="en"><meta charset="utf-8"><title>Horse review</title>
<style>body{margin:0;background:#e7edf0;font:14px system-ui}canvas{display:block}nav{position:absolute;top:12px;left:12px;background:#fffd;padding:10px 12px;border-radius:8px;max-height:calc(100vh - 48px);overflow:auto;width:260px}button,select{font:inherit;margin:2px;padding:4px 7px}label{display:grid;grid-template-columns:78px 1fr 38px;gap:4px;align-items:center;font-size:12px}label.check{display:inline-flex;gap:4px;margin-right:8px}output{display:block;white-space:pre;font:11px monospace;margin-top:6px}h4{margin:8px 0 2px;font-size:12px}</style>
<nav><h4>Gait</h4><div id="gaits"></div><label class="check"><input id="idle" type="checkbox" checked> idle (standing, it fidgets)</label>
<output id="status">Loading…</output>
<h4>Pose</h4><div id="poses"></div><div id="sliders"></div>
<h4>Rider</h4><select id="rider"><option value="female">Female</option><option value="male">Male</option><option value="">None</option></select>
<label class="check"><input id="mounted" type="checkbox" checked> mounted</label><label class="check"><input id="tack" type="checkbox" checked> tack</label>
<h4>Fit (metres)</h4><div id="fit"></div>
<h4>View</h4><button data-view="side">Side</button><button data-view="front">Front</button><button data-view="three">¾</button><button data-view="top">Top</button><button data-view="back">Back</button><br>
<label class="check"><input id="ink" type="checkbox" checked> ink</label><label class="check"><input id="bones" type="checkbox"> bones</label><button id="pause">Pause</button></nav>
<script type="module" src="./horse-review.js"></script></html>
